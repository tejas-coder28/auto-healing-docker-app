name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t auto-healing-app:${{ github.sha }} .

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 5000:5000 auto-healing-app:${{ github.sha }}
          sleep 5
          curl --fail http://localhost:5000/health
          docker rm -f smoke
